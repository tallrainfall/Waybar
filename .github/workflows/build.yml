name: build it

on:
  push:
    branches: [ "master" ]

jobs:
  build:

    env:
      DEBIAN_FRONTEND: noninteractive

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install build dependencies
      # Not sure if all these are required, the README kind of doesn't specify
      run: sudo apt -y install python3 ninja-build meson clang-tidy gobject-introspection libdbusmenu-gtk3-dev libevdev-dev libfmt-dev libgirepository1.0-dev libgtk-3-dev libgtkmm-3.0-dev libinput-dev libjsoncpp-dev libmpdclient-dev libnl-3-dev libnl-genl-3-dev libpulse-dev libsigc++-2.0-dev libspdlog-dev libwayland-dev scdoc upower libxkbregistry-dev
    
    #- name: Set up Python
    #  uses: actions/setup-python@v7
    #  with:
    #    cache: 'pip'
        
    #- name: Install Meson
    #  run: pip install meson
      
    - run: meson setup build
    
    #- name: Set up Ninja
    #  uses: ashutoshvarma/setup-ninja@v1.1
    #  with:
    #    version: '1.13.2'
    #    platform: linux
        
    - run: ninja -C build

    #- run: tar cvf build build.tar.gz

    - uses: actions/upload-artifact@v7
      with:
        name: waybar-linux
        path: build/
        if-no-files-found: error
        overwrite: true
        archive: true
